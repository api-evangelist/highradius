aid: highradius
name: HighRadius
description: >-
  HighRadius is an AI-powered autonomous finance platform for the Office of the
  CFO, automating the Order-to-Cash (O2C), Record-to-Report (R2R), Accounts
  Payable (AP), and Treasury processes with a network of orchestrated AI agents.
  The platform covers invoicing, collections, cash application, deductions,
  credit, dispute management, financial close, reconciliation, consolidation,
  and cash forecasting. HighRadius serves 1,500+ enterprise customers and ships
  pre-built integrations with 50+ ERPs and systems including SAP, Oracle,
  Microsoft Dynamics, and NetSuite. Integration is delivered through those
  pre-built ERP connectors and partner engagements rather than a public
  self-serve developer API; the company publishes a Trust Center documenting
  SOC 2, ISO 27001, PCI DSS, and GDPR posture.
